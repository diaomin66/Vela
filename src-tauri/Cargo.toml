[package]
name = "vela"
version = "0.5.0"
description = "A thoughtful Windows companion for Codex connections and recovery"
edition = "2021"
default-run = "vela"

[lib]
name = "vela_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2.13.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
fs2 = "0.4"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
futures-util = "0.3"
zeroize = "1"
quick-xml = "0.42"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
